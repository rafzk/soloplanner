<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solo Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: top bar with tabs, one working view below; wide grids scroll inside their own container. */
  --bg:#f2f4f6; --surface:#ffffff; --ink:#15212b; --muted:#5b6b78; --line:#dde3e8;
  --accent:#0e6b66; --accent-ink:#ffffff; --accent-soft:#dff1ef;
  --good:#17803d; --good-soft:#dcf3e4; --warn:#a15c07; --warn-soft:#fbeed3; --crit:#b42318; --crit-soft:#fbe0dd;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f161c; --surface:#17212a; --ink:#e6edf2; --muted:#93a3b0; --line:#28353f;
    --accent:#4fc3bb; --accent-ink:#06201e; --accent-soft:#153a38;
    --good:#55c47e; --good-soft:#14301f; --warn:#e0a64a; --warn-soft:#3a2a0d; --crit:#f2837a; --crit-soft:#3d1713;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#17212a; --ink:#e6edf2; --muted:#93a3b0; --line:#28353f;
  --accent:#4fc3bb; --accent-ink:#06201e; --accent-soft:#153a38;
  --good:#55c47e; --good-soft:#14301f; --warn:#e0a64a; --warn-soft:#3a2a0d; --crit:#f2837a; --crit-soft:#3d1713;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:600}
h2{font-size:20px}
h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:18px 0 10px}
header.top h1{font-size:18px;letter-spacing:.01em}
.hdate{font-size:13px;color:var(--muted)}
#status{margin-left:auto;font-size:12px;color:var(--muted);font-family:var(--font-num)}
#status.err{color:var(--crit);background:var(--crit-soft);padding:3px 10px;border-radius:99px;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:20px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:hover{color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ctl{display:flex;gap:6px;flex-wrap:wrap}
.hint{color:var(--muted);margin:4px 0 14px;max-width:70ch;font-size:14px}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--crit)}
.btn.small{padding:3px 8px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%}
table.grid th,table.grid td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
table.grid thead th{font-size:12px;font-weight:500;color:var(--muted);background:var(--surface)}
table.grid tbody tr:last-child th,table.grid tbody tr:last-child td{border-bottom:0}
th.sticky{position:sticky;left:0;background:var(--surface);text-align:left;z-index:1;width:220px;min-width:170px;max-width:220px;box-shadow:1px 0 0 var(--line)}
table.grid th.sticky{text-align:left}
table.grid th.rowh{font-weight:500;white-space:normal;vertical-align:middle}
th.rowh .dot{margin-right:8px}
th.rowh small{display:block;margin-left:18px;color:var(--muted);font-weight:400;font-size:12px;line-height:1.4}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
#f-color{width:56px;height:36px;padding:2px;cursor:pointer}
.now{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
table.grid thead th.now{color:var(--accent);font-weight:600;background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
table.grid thead th.we{background:color-mix(in srgb,var(--muted) 8%,var(--surface))}
.we{background:color-mix(in srgb,var(--muted) 8%,var(--surface))}
input.cell{width:58px;text-align:center;font-family:var(--font-num);border:1px solid transparent;border-radius:6px;padding:8px 2px;background:transparent}
input.cell:hover{border-color:var(--line)}
input.cell:focus{border-color:var(--accent);background:var(--surface)}
input.cell.l1{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
input.cell.l2{background:color-mix(in srgb,var(--accent) 32%,var(--surface))}
input.cell.l3{background:color-mix(in srgb,var(--accent) 46%,var(--surface))}
input.cell.l4{background:color-mix(in srgb,var(--accent) 62%,var(--surface))}
input.cell.l5{background:color-mix(in srgb,var(--accent) 80%,var(--surface));color:var(--accent-ink)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
table.grid td{position:relative}
/* Timesheet cell: a visible box with its unit, and the note / clear buttons right next to it (shown on hover or focus, and always for a note that exists) */
.cw{display:inline-flex;align-items:center;gap:4px;vertical-align:middle}
.iw{position:relative;display:inline-block}
.iw .cu{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--muted);pointer-events:none}
input.cell.tcell{width:76px;padding:8px 20px 8px 6px;border-color:var(--line);background:var(--surface)}
input.cell.tcell::placeholder{color:var(--muted)}
.ca{display:inline-flex;flex-direction:column;justify-content:center;gap:2px;width:24px;min-height:46px}
.ca button{width:24px;height:22px;border:0;background:none;cursor:pointer;color:var(--muted);line-height:1;padding:0;display:grid;place-items:center;border-radius:6px;opacity:0;transition:opacity .12s}
.ca .x{font-size:17px}
.ca .nb{font-size:14px}
.ca .nb.on{color:var(--accent);opacity:1}
td:hover .ca button,td:focus-within .ca button{opacity:.85}
@media (hover:none){ .ca button{opacity:.7} }
.ca .x:hover{color:var(--crit);opacity:1;background:var(--crit-soft)}
.ca .nb:hover{opacity:1;background:var(--accent-soft)}
table.grid.mgrid .cw{display:block}
table.grid.mgrid .cu{display:none}
table.grid.mgrid .ca{position:absolute;right:0;bottom:0;width:auto;min-height:0;flex-direction:row;background:transparent;border-radius:6px}
table.grid.mgrid td:hover .ca,table.grid.mgrid td:focus-within .ca{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.18)}
table.grid td.tot{min-width:84px;padding-right:12px}
table.grid.mgrid .ca button{width:18px;height:18px;font-size:12px}
.tg{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:500}
.tg input{width:16px;height:16px;margin:0}
.hint .tip{color:var(--muted);font-size:13px}
.scrollx{overflow-x:auto}
table.inc th.l,table.inc td.l{text-align:left}
tr.noterow td,tr.noterow th{background:color-mix(in srgb,var(--accent) 6%,var(--surface));text-align:left;white-space:normal}
.noterow textarea,.tcard textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);color:var(--ink);resize:vertical}
.noterow label{display:grid;gap:6px;font-size:12px;color:var(--muted);font-weight:500}
.nline{margin:8px 0;font-size:14px}
td.tot small{display:block;color:var(--muted);font-size:11px}
/* "Reset row" only appears when you hover or focus the row (always visible on touch screens) */
@media (hover:hover){
  table.grid .rr{opacity:0;transition:opacity .15s}
  table.grid tr:hover .rr,table.grid tr:focus-within .rr{opacity:1}
}
small.used{display:block;color:var(--muted);font-size:12px;font-family:var(--font-num);line-height:1.3;margin-top:2px}
small.used.over{color:var(--crit);font-weight:600}
button.pm small.used{color:inherit;opacity:.85}
button.pm small.used.over{color:inherit;opacity:1;font-weight:700}
tr.sum th,tr.sum td{background:color-mix(in srgb,var(--muted) 6%,var(--surface));font-weight:500}
.over{color:var(--crit);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:22px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.tile .v{font-family:var(--font-num);font-size:22px;font-weight:500;margin-top:4px;line-height:1.3}
.tile .v.none{color:var(--muted);font-size:18px}
.tile.crit{border-color:var(--crit)}
.tile.crit .v{color:var(--crit)}
.tile small{display:block;color:var(--muted);margin-top:4px}
.meter{height:6px;border-radius:99px;background:color-mix(in srgb,var(--muted) 18%,var(--surface));margin-top:8px;overflow:hidden}
.meter span{display:block;height:100%;background:var(--accent);border-radius:99px}
.month{margin-bottom:20px}
.month h3{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:0 0 8px}
.month h3 .mt{margin-left:auto;font-family:var(--font-num);font-weight:400;color:var(--muted);font-size:13px}
.chip{font-size:11px;background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:99px;font-weight:600}
.chip.ended{background:color-mix(in srgb,var(--muted) 14%,var(--surface));color:var(--muted)}
.chip.soon{background:var(--warn-soft);color:var(--warn)}
.arow.ended{opacity:.85}
.arow.ended strong{color:var(--muted)}
.arow .meta{margin-top:2px}
.arow .ml{display:inline-block;width:76px;font-size:12px;opacity:.8}
table.inc th,table.inc td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
table.inc th:first-child,table.inc td:first-child{text-align:left}
table.inc thead th{font-size:12px;font-weight:500;color:var(--muted)}
table.inc tbody tr:last-child td{border-bottom:0}
table.inc td small{display:block;color:var(--muted);font-size:11px}
table.inc td small .btn{margin-top:4px}
/* Income controls share one height and one width rhythm: number + icon, date, amount */
input.amt,input.inv,input.dt{height:32px;font-size:13px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 8px}
input.amt{width:112px;text-align:right;font-family:var(--font-num);padding-left:24px}
input.inv{width:100px;text-align:left}
input.dt{width:136px}
input.inv[data-sugg]::placeholder{color:var(--accent);opacity:.9}
.amtwrap{position:relative;display:inline-block}
.amtwrap .cur{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
.invc{display:inline-flex;align-items:center;gap:4px}
.ibtn{width:32px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0}
.ibtn:hover{color:var(--accent);border-color:var(--accent)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.idle{background:color-mix(in srgb,var(--muted) 14%,var(--surface));color:var(--muted)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
form.f label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
form.f input,form.f select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);color:var(--ink)}
form.f textarea{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);color:var(--ink);resize:vertical;width:100%}
form.af .grp .wide{grid-column:1/-1}
.arow .desc{color:var(--muted);font-size:13px;margin-top:6px;max-width:80ch;white-space:normal}
form.f input[type=checkbox]{width:18px;height:18px;padding:0}
form.f label.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
form#sform{align-items:start}
form#sform label.chk{margin-top:26px;min-height:38px}
form.f input[aria-invalid="true"],form.f select[aria-invalid="true"]{border-color:var(--crit)}
form.f .row{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
form.af{display:block}
form.af .grp{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 14px;align-items:start;margin-bottom:20px}
form.af .gt{grid-column:1/-1;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:4px}
.help{font-weight:400;color:var(--muted);font-size:12px}
.ferr{color:var(--crit);font-size:12px;font-weight:500}
.ferr:empty{display:none}
.err{color:var(--crit);font-size:13px}
.alist{display:grid;gap:10px;margin-top:18px}
.arow{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.arow .meta{color:var(--muted);font-size:13px}
.empty{max-width:560px;margin:40px auto;text-align:center}
.empty h2{margin-bottom:8px}
.empty p{color:var(--muted)}
.empty .ctl{justify-content:center;margin-top:16px}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner:empty{display:none}
.foot{color:var(--muted);font-size:13px;max-width:80ch;margin-top:18px}
@media (max-width:600px){
  th.sticky{min-width:120px}
  input.cell{width:48px}
  .tab{padding:10px 10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
body.locked nav.tabs,body.locked #status,body.locked #banner,body.locked #lockbtn,body.locked #eyebtn,body.locked #hdate,body.locked #toast{display:none!important}
dialog#confirm{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px 22px;width:calc(100% - 32px);max-width:440px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
dialog#confirm::backdrop,dialog#docdlg::backdrop{background:rgba(10,16,22,.5)}
dialog#docdlg{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px 22px;width:calc(100% - 32px);max-width:520px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.docs{margin-top:10px;display:grid;gap:4px;justify-items:start}
.doc{display:flex;align-items:center;gap:4px;font-size:13px}
.doc svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.doc .hlink{display:inline-flex;align-items:center;gap:6px}
dialog#confirm p{color:var(--muted);margin:8px 0 18px}
dialog#confirm .ctl{justify-content:flex-end}
.btn.danger.solid{background:var(--crit);border-color:var(--crit);color:#fff}
table.grid.mgrid th:not(.sticky),table.grid.mgrid td{padding:4px 2px}
table.grid.mgrid input.cell{width:40px;padding:6px 0}
table.grid.mgrid .wk{border-left:1px solid var(--line)}
/* Toolbars: view switch (segmented), period navigation (‹ label ›), Today; secondary actions in menus or below the table */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 6px}
.toolbar .sp{flex:1 1 auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.navg{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.navg .ic{border:0;background:none;cursor:pointer;padding:4px 12px;font-size:18px;line-height:1.2;color:var(--muted)}
.navg .ic:hover{color:var(--ink)}
.navg .lbl,.navg input{font-weight:600;padding:5px 4px;border:0;background:transparent;color:var(--ink);text-align:center}
.navg .lbl{min-width:9em;white-space:nowrap}
details.menu{position:relative}
details.menu>summary{list-style:none;user-select:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu .pop{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:4px;z-index:5;min-width:180px;display:grid}
details.menu .pop button{border:0;background:none;text-align:left;padding:8px 10px;border-radius:6px;cursor:pointer;color:var(--ink)}
details.menu .pop button:hover{background:var(--accent-soft)}
.hlink{border:0;background:none;padding:2px 4px;cursor:pointer;color:inherit;font:inherit;border-radius:4px}
.hlink:hover{color:var(--accent);text-decoration:underline}
.hlink.under{text-decoration:underline dotted;text-underline-offset:3px}
button.pm{min-width:52px;border:1px solid transparent;border-radius:6px;padding:6px 4px;background:transparent;cursor:pointer;font-family:var(--font-num);color:var(--ink)}
button.pm:hover{border-color:var(--accent)}
button.pm.l0{color:var(--muted)}
button.pm.l1{background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
button.pm.l2{background:color-mix(in srgb,var(--accent) 32%,var(--surface))}
button.pm.l3{background:color-mix(in srgb,var(--accent) 46%,var(--surface))}
button.pm.l4{background:color-mix(in srgb,var(--accent) 62%,var(--surface))}
button.pm.l5{background:color-mix(in srgb,var(--accent) 80%,var(--surface));color:var(--accent-ink)}
.legend{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin:0 0 10px}
.legend i{display:inline-block;width:22px;height:12px;border-radius:3px}
.legend i:nth-of-type(1){background:color-mix(in srgb,var(--accent) 18%,var(--surface))}
.legend i:nth-of-type(2){background:color-mix(in srgb,var(--accent) 32%,var(--surface))}
.legend i:nth-of-type(3){background:color-mix(in srgb,var(--accent) 46%,var(--surface))}
.legend i:nth-of-type(4){background:color-mix(in srgb,var(--accent) 62%,var(--surface))}
.legend i:nth-of-type(5){background:color-mix(in srgb,var(--accent) 80%,var(--surface))}
.tfoot{display:flex;justify-content:flex-end;margin-top:8px}
input.mask{-webkit-text-security:disc}
#eyebtn{display:inline-flex;align-items:center;gap:6px}
#eyebtn svg{width:16px;height:16px;flex:none}
form.lockf{grid-template-columns:1fr;max-width:340px;margin:18px auto 0;text-align:left}
form.lockf .row{justify-content:center}
select.sel{border:1px solid var(--line);border-radius:6px;padding:6px 10px;background:var(--surface);color:var(--ink);font-weight:500}
.rsec{margin-top:22px}
.rsec h3{margin-bottom:8px}
table.inc td.note{text-align:left;white-space:normal;min-width:220px;max-width:480px}
table.inc tr.rtot td{font-weight:600;background:color-mix(in srgb,var(--muted) 6%,var(--surface))}
/* Today view: big targets, one card per client */
.tcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px;margin-bottom:22px}
.tcard{background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--accent);border-radius:12px;padding:16px;display:grid;gap:12px}
.tcard .thead{display:flex;flex-wrap:wrap;gap:2px 10px;align-items:baseline;justify-content:space-between}
.tcard .meta{color:var(--muted);font-size:13px}
.stepper{display:flex;align-items:center;justify-content:center;gap:14px}
.sbtn{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:26px;line-height:1;cursor:pointer;font-weight:500;display:grid;place-items:center}
.sbtn:hover{border-color:var(--accent)}
.sval{font-size:30px;font-weight:500;min-width:5.5em;text-align:center;line-height:1.1}
.sval small{display:block;font-size:13px;color:var(--muted);font-weight:400;font-family:var(--font-body)}
.tact{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tact .btn{min-height:40px;padding:6px 14px}
.dbtn{min-width:46px;min-height:42px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-family:var(--font-num);font-size:15px}
.dbtn:hover{border-color:var(--accent)}
.dbtn.on{background:color-mix(in srgb,var(--accent) 26%,var(--surface));border-color:var(--accent)}
.dbtn.full{background:color-mix(in srgb,var(--accent) 60%,var(--surface));color:var(--accent-ink)}
.check ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.check li.done{color:var(--muted)}
.check li span{display:inline-block;width:1.4em}
.check li.done span{color:var(--good)}
.check{margin-bottom:18px}
/* Toast with undo */
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:10px;display:flex;gap:12px;align-items:center;z-index:50;box-shadow:0 8px 28px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
#toast .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 50%,transparent)}
#toast .tx{border:0;background:none;color:var(--bg);font-size:20px;line-height:1;cursor:pointer;opacity:.8;padding:0 4px}
/* Report chart */
svg.ch{width:100%;height:auto;max-height:260px;min-width:520px;display:block}
table.inc tr.idle td{color:var(--muted)}
svg.ch text{fill:var(--muted);font:11px var(--font-num)}
svg.ch text.vl{fill:var(--ink)}
svg.ch .gl{stroke:var(--line);stroke-width:1}
svg.ch .cbar{stroke:var(--surface);stroke-width:2;paint-order:stroke}
.legend2{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13px}
details.past>summary{cursor:pointer;font-weight:600;font-size:18px;margin:28px 0 12px}
@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){
    --bg:#ffffff; --surface:#ffffff; --ink:#15212b; --muted:#5b6b78; --line:#dde3e8;
    --accent:#0e6b66; --accent-ink:#ffffff; --accent-soft:#dff1ef; color-scheme:light;
  }
  header.top,nav.tabs,#banner,#toast,.noprint{display:none!important}
  body{background:#fff;font-size:12px}
  .wrap{max-width:none;padding:0}
  .scroll{overflow:visible;border:0}
  .tile,.rsec{break-inside:avoid}

}

<body>

  </header>
  <div id="banner"></div>

</dialog>

  <div class="ctl"><button class="btn" data-act="cf-no" autofocus>Cancel</button><button class="btn danger solid" data-act="cf-yes" id="cf-yes"></button></div>
</dialog>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var $ = function(s, el){ return (el||document).querySelector(s); };
var pad = function(n){ return String(n).padStart(2,'0'); };
var iso = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); };
var parse = function(s){ var p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); };
var addDays = function(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; };
var monday = function(d){ return addDays(d, -((d.getDay()+6)%7)); };
var today = new Date(); today.setHours(0,0,0,0);
var todayISO = iso(today);
var ymOf = function(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); };
var uid = function(){ return Math.random().toString(36).slice(2,9); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var LS = {
  get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set:function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del:function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
/* "Hide amounts" is remembered in this browser. It is visible by default. */
var masked = LS.get('solo-planner-mask')==='1';
function setMasked(on){ masked=on; if(on) LS.set('solo-planner-mask','1'); else LS.del('solo-planner-mask'); }

/* ---------- state ---------- */
var DEFAULTS = { capacity:5, hideWeekends:false, locale:'en-GB' };
var state = { v:1, assignments:[], plan:{}, entries:{}, payments:{}, notes:{}, invoices:{}, settings:Object.assign({},DEFAULTS) };
var LOC = function(){ return state.settings.locale || 'en-GB'; };
var CAP = function(){ var c=state.settings.capacity; return c>0 ? c : 5; };
var byId = function(id){ return state.assignments.filter(function(x){ return x.id===id; })[0]; };

var curSym = function(cur){ try{ var p=new Intl.NumberFormat(LOC(),{style:'currency',currency:cur}).formatToParts(0).filter(function(x){ return x.type==='currency'; })[0]; return p?p.value:cur+' '; }catch(e){ return cur+' '; } };
var mk = function(){ return masked?' mask':''; };
/* Whole amounts show no decimals (€7,852); anything else always shows two (€5,909.60) */
var money = function(v,cur){ if(masked) return curSym(cur)+'••••'; var f=Math.abs(v-Math.round(v))<0.005?0:2; try{ return new Intl.NumberFormat(LOC(),{style:'currency',currency:cur,minimumFractionDigits:f,maximumFractionDigits:2}).format(v); }catch(e){ return cur+' '+v.toFixed(2); } };
var ICON_CLIP='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';
var ICON_FILE='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
var num = function(v){ var n=parseFloat(String(v).replace(',','.')); return isFinite(n)?n:0; };
var fmtN = function(v){ return v ? String(Math.round(v*100)/100) : ''; };
var round2 = function(v){ return Math.round(v*100)/100; };
var fmtDay = function(d){ return d.toLocaleDateString(LOC(),{day:'numeric',month:'short'}); };
var fmtDayY = function(d){ return fmtDay(d)+' '+d.getFullYear(); };
var fmtDow = function(d){ return d.toLocaleDateString(LOC(),{weekday:'short'}); };
var monthLabel = function(ym){ var p=ym.split('-').map(Number); return new Date(p[0],p[1]-1,1).toLocaleDateString(LOC(),{month:'long',year:'numeric'}); };
var COLORS = ['#0e6b66','#7c4dbd','#c2570c','#1f6fb2','#a1306b','#5c7a1f','#b3261e','#8a6d00','#37474f','#00838f'];

var view = 'today';
var plannerStart = addDays(monday(today), -7);
var plMode = 'week';
var plMonthStart = ymOf(new Date(today.getFullYear(), today.getMonth()-1, 1));
var weekAnchor = monday(today);
var tsMode = 'week';
var tsMonth = ymOf(today);
var editing = null, showForm = false, pastOpen = false, endedOpen = false;
var pendingConfirm = null;
function askConfirm(title, msg, yesLabel, fn){
  var dlg=$('#confirm');
  $('#cf-title').textContent=title; $('#cf-msg').textContent=msg; $('#cf-yes').textContent=yesLabel;
  pendingConfirm=fn;
  if(dlg.showModal){ if(!dlg.open) dlg.showModal(); }
  else if(window.confirm(title+'\n\n'+msg)){ pendingConfirm=null; fn(); }
}
$('#confirm').addEventListener('close', function(){ pendingConfirm=null; });
function closeConfirm(run){
  var fn=pendingConfirm, dlg=$('#confirm'); pendingConfirm=null;
  if(dlg.open) dlg.close();
  if(run && fn) fn();
}
var noteKey = null;
var repType = 'month', repAnchor = new Date(today), repFilter = 'all';
var loaded = false;

/* ---------- undo toast ---------- */
var toastTimer = null, undoSnap = null;
function snapshot(){ return JSON.stringify({ assignments:state.assignments, plan:state.plan, entries:state.entries, payments:state.payments, notes:state.notes, invoices:state.invoices, settings:state.settings }); }
function hideToast(){ var el=$('#toast'); el.hidden=true; undoSnap=null; clearTimeout(toastTimer); }
function toast(msg, snap){
  var el=$('#toast'); undoSnap=snap||null;
  el.innerHTML='<span>'+esc(msg)+'</span>'+(snap?'<button class="btn small" data-act="undo">Undo</button>':'')+'<button class="tx" data-act="toast-close" aria-label="Dismiss">×</button>';
  el.hidden=false; clearTimeout(toastTimer); toastTimer=setTimeout(hideToast, snap?8000:3500);
}

/* ---------- optional password lock (screen lock only; the data file itself is not encrypted) ---------- */
var PWKEY = 'solo-planner-pw', SESSKEY = 'solo-planner-unlocked';
var pwChange = false;
function pwGet(){ try{ return JSON.parse(localStorage.getItem(PWKEY)||'null'); }catch(e){ return null; } }
function pwPut(o){ try{ localStorage.setItem(PWKEY, JSON.stringify(o)); return true; }catch(e){ return false; } }
var locked = (function(){ try{ return !!pwGet() && sessionStorage.getItem(SESSKEY)!=='1'; }catch(e){ return false; } })();
function setUnlocked(on){ locked=!on; try{ if(on) sessionStorage.setItem(SESSKEY,'1'); else sessionStorage.removeItem(SESSKEY); }catch(e){} }
function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf), function(b){ return b.toString(16).padStart(2,'0'); }).join(''); }
async function hashPw(pw,salt){
  if(window.crypto && crypto.subtle){
    var enc=new TextEncoder();
    var key=await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits=await crypto.subtle.deriveBits({ name:'PBKDF2', salt:enc.encode(salt), iterations:200000, hash:'SHA-256' }, key, 256);
    return 'p2:'+hex(bits);
  }
  var h=2166136261, s=salt+'|'+pw, r, i;
  for(r=0;r<2000;r++) for(i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return 'f1:'+h.toString(16);
}
async function pwCheck(pw){ var o=pwGet(); if(!o) return false; return (await hashPw(pw,o.salt))===o.hash; }
async function pwSet(pw){ var salt=hex(crypto.getRandomValues(new Uint8Array(16)).buffer); return pwPut({ salt:salt, hash:await hashPw(pw,salt) }); }
function renderLock(){
  return '<section class="card empty"><h2>Solo Planner is locked</h2><p>Enter your password to continue.</p>'+
    '<form class="f lockf" id="lockform" novalidate>'+
    '<label>Password<input type="password" id="pw1" autocomplete="current-password" required></label>'+
    '<div class="row"><button class="btn primary" type="submit">Unlock</button></div><span class="err" id="pw-err" role="alert"></span></form></section>';
}
function pwCardHTML(){
  if(!pwGet()){
    if(!pwChange) return '<section class="card" style="margin-top:16px"><h3>Password (optional)</h3><p class="hint">Lock this page with a password each time you open it in this browser. It does not encrypt the data file.</p><div class="ctl"><button class="btn small" data-act="pw-change">Set a password</button></div></section>';
    return '<section class="card" style="margin-top:16px"><h3>Set a password</h3><form class="f" id="pwsetform" novalidate>'+
      '<label>New password<input type="password" id="pwn1" autocomplete="new-password"></label>'+
      '<label>Repeat password<input type="password" id="pwn2" autocomplete="new-password"></label>'+
      '<div class="row"><button class="btn primary" type="submit">Save password</button><button class="btn" type="button" data-act="pw-cancel">Cancel</button><span class="err" id="pwc-err" role="alert"></span></div></form></section>';
  }
  if(!pwChange) return '<section class="card" style="margin-top:16px"><h3>Password</h3><p class="hint">The password locks this page in this browser. It does not encrypt the data file.</p><div class="ctl"><button class="btn small" data-act="pw-change">Change password</button><button class="btn small" data-act="lock">Lock now</button><button class="btn small danger" data-act="pw-remove">Remove password</button></div></section>';
  return '<section class="card" style="margin-top:16px"><h3>Change password</h3><form class="f" id="pwform" novalidate>'+
    '<label>Current password<input type="password" id="pwc" autocomplete="current-password"></label>'+
    '<label>New password<input type="password" id="pwn1" autocomplete="new-password"></label>'+
    '<label>Repeat new password<input type="password" id="pwn2" autocomplete="new-password"></label>'+
    '<div class="row"><button class="btn primary" type="submit">Save password</button><button class="btn" type="button" data-act="pw-cancel">Cancel</button><span class="err" id="pwc-err" role="alert"></span></div></form></section>';
}

/* ---------- persistence: one JSON file on disk ---------- */
var supportsFS = !!(window.showSaveFilePicker && window.showOpenFilePicker);
var fh = null, fileName = '', lastText = null, connected = false, needPerm = false;
var persist = 'init', saveTimer = null, saving = false, again = false, conflict = false;
var JSON_TYPES = [{ description:'JSON data file', accept:{'application/json':['.json']} }];

function idb(){ return new Promise(function(res,rej){ var r=indexedDB.open('solo-planner',1); r.onupgradeneeded=function(){ r.result.createObjectStore('h'); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }); }
function idbGet(k){ return idb().then(function(db){ return new Promise(function(res,rej){ var q=db.transaction('h').objectStore('h').get(k); q.onsuccess=function(){ res(q.result); }; q.onerror=function(){ rej(q.error); }; }); }); }
function idbSet(k,v){ return idb().then(function(db){ return new Promise(function(res,rej){ var q=db.transaction('h','readwrite').objectStore('h').put(v,k); q.onsuccess=function(){ res(); }; q.onerror=function(){ rej(q.error); }; }); }); }

function setStatus(){
  var el=$('#status'), t='', err=false;
  if(!supportsFS){ t='Not saved to a file · use Export'; err=true; }
  else if(!connected){ t=''; }
  else if(persist==='dirty'){ t=fileName+' · unsaved changes…'; }
  else if(persist==='saving'){ t=fileName+' · saving…'; }
  else if(persist==='saved'){ t=fileName+' · saved'; }
  else if(persist==='conflict'){ t=fileName+' · changed elsewhere'; err=true; }
  else if(persist==='error'){ t='Could not save '+fileName; err=true; }
  el.textContent=t; el.className=err?'err':'';
}
function applyData(d){
  state.assignments=d.assignments||[]; state.plan=d.plan||{}; state.entries=d.entries||{}; state.payments=d.payments||{}; state.notes=d.notes||{}; state.invoices=d.invoices||{};
  state.settings=Object.assign({},DEFAULTS,d.settings||{});
}
function serialize(){ return JSON.stringify(Object.assign({ savedAt:new Date().toISOString() }, state), null, 1); }
async function readFromHandle(){
  var f=await fh.getFile(); var txt=await f.text(); fileName=f.name;
  if(txt.trim()){ applyData(JSON.parse(txt)); lastText=txt; } else { lastText=''; }
}
async function connect(h, isNew){
  fh=h; fileName=h.name;
  try{ await idbSet('file',h); }catch(e){}
  try{
    if(!isNew) await readFromHandle(); else lastText='';
    connected=true; needPerm=false; conflict=false; persist='saved';
    if(isNew) await flush(true);
  }catch(e){ persist='error'; connected=true; }
  loaded=true; setStatus(); render();
}
function scheduleSave(){
  if(!fh || !connected || conflict) return;
  clearTimeout(saveTimer); persist='dirty'; setStatus();
  saveTimer=setTimeout(function(){ flush(false); }, 600);
}
async function flush(force){
  if(!fh) return;
  if(saving){ again=true; return; }
  saving=true; persist='saving'; setStatus();
  try{
    if(!force){
      var cur=await (await fh.getFile()).text();
      if(lastText!==null && cur.trim() && cur!==lastText){ conflict=true; persist='conflict'; saving=false; setStatus(); render(); return; }
    }
    var out=serialize(), w=await fh.createWritable();
    await w.write(out); await w.close();
    lastText=out; persist='saved';
  }catch(e){ persist='error'; }
  saving=false; setStatus(); if(persist==='error') render();
  if(again){ again=false; flush(false); }
}
/* Invoice files: copied into a folder you choose, organised as Year / Month / Client_YYYY-MM_InvoiceNo.pdf */
var supportsDir = !!window.showDirectoryPicker;
var invDir = null, pendingInv = null;
var safeName = function(s){ return String(s).trim().replace(/[\\\/:*?"<>|]+/g,'').replace(/\s+/g,'-').replace(/-{2,}/g,'-').replace(/^-|-$/g,''); };
async function pickInvDir(){
  try{ var h=await window.showDirectoryPicker({ mode:'readwrite' }); invDir=h; try{ await idbSet('invdir',h); }catch(e){} return true; }
  catch(e){ return false; }
}
async function invDirReady(){
  if(!invDir) return false;
  try{ var p=await invDir.queryPermission({mode:'readwrite'}); if(p==='granted') return true; p=await invDir.requestPermission({mode:'readwrite'}); return p==='granted'; }
  catch(e){ return false; }
}
async function invDirOf(path){
  var parts=path.split('/'), name=parts.pop(), dir=invDir, i;
  for(i=0;i<parts.length;i++) dir=await dir.getDirectoryHandle(parts[i]);
  return { dir:dir, name:name, parts:parts };
}
/* When the invoice number changes, the attached file is renamed to match (the old name is removed). */
async function renameInvoiceFile(key){
  var inv=state.invoices[key]; if(!inv || !inv.file || !inv.no || !invDir) return;
  var p=key.split('|'), a=byId(p[0]); if(!a) return;
  var cur=inv.file.split('/'), oldName=cur[cur.length-1], ext=((/\.([a-z0-9]{2,4})$/i.exec(oldName)||[])[1]||'pdf').toLowerCase();
  var newName=safeName(inv.no)+'_'+safeName(a.name)+'_'+p[1]+'.'+ext;
  if(newName===oldName) return;
  if(!(await invDirReady())){ toast('Number saved, but the file was not renamed. Allow access to the invoice folder and edit the number again.'); return; }
  try{
    var o=await invDirOf(inv.file), exists=false;
    try{ await o.dir.getFileHandle(newName); exists=true; }catch(e){}
    if(exists){ toast('A file named '+newName+' already exists, so the file was not renamed.'); return; }
    var file=await (await o.dir.getFileHandle(oldName)).getFile();
    var h=await o.dir.getFileHandle(newName,{create:true}), w=await h.createWritable();
    await w.write(file); await w.close();
    await o.dir.removeEntry(oldName);
    inv.file=o.parts.concat([newName]).join('/'); changed(); render(); toast('File renamed to '+newName);
  }catch(e){ toast('Number saved, but the file could not be renamed. Is it still in the invoice folder?'); }
}
async function attachInvoice(key,f){
  var p=key.split('|'), a=byId(p[0]), ym=p[1], inv=state.invoices[key]; if(!a || !inv || !inv.no) return;
  var prev=inv.file;
  var ext=(/\.([a-z0-9]{2,4})$/i.exec(f.name)||[])[1]; ext=(ext||'pdf').toLowerCase();
  var parts=[ym.slice(0,4), ym.slice(5,7)], name=safeName(inv.no)+'_'+safeName(a.name)+'_'+ym+'.'+ext;
  try{
    var dir=invDir, i;
    for(i=0;i<parts.length;i++) dir=await dir.getDirectoryHandle(parts[i],{create:true});
    var exists=false; try{ await dir.getFileHandle(name); exists=true; }catch(e){}
    var write=async function(){
      var h=await dir.getFileHandle(name,{create:true}), w=await h.createWritable();
      await w.write(f); await w.close();
      inv.file=parts.join('/')+'/'+name;
      if(prev && prev!==inv.file){ try{ var o2=await invDirOf(prev); await o2.dir.removeEntry(o2.name); }catch(e){} } /* the earlier copy of this invoice is replaced */
      changed(); render(); toast('Saved '+inv.file);
    };
    if(exists) askConfirm('Replace the existing file?', name+' already exists in '+parts.join('/')+'.', 'Replace', function(){ write().catch(function(){ toast('Could not save the file.'); }); });
    else await write();
  }catch(e){ toast('Could not save the invoice file.'); }
}
/* Opens any file stored in the folder (an invoice or a client document) from its relative path */
async function openStored(path){
  if(!path) return;
  if(!invDir){ toast('Choose the folder in Settings › Invoice folder first.'); return; }
  if(!(await invDirReady())){ toast('Allow access to the folder to open the file.'); return; }
  try{
    var parts=path.split('/'), dir=invDir, i;
    for(i=0;i<parts.length-1;i++) dir=await dir.getDirectoryHandle(parts[i]);

/* ---------- domain ---------- */
var unit = function(a){ return a.rateType==='day' ? 'd' : 'h'; };
var rateLabel = function(a){ return money(a.rate,a.currency)+(a.rateType==='day'?' / day':' / hour'); };
var subLabel = function(a){ return (a.role ? esc(a.role)+' · ' : '')+esc(rateLabel(a)); }; /* role (if any) and rate, escaped */
var inRange = function(a,d){ return d>=a.start && (!a.end || d<=a.end); };
var weekOverlaps = function(a,w){ var we=iso(addDays(parse(w),6)); return a.start<=we && (!a.end || a.end>=w); };
var defaultWeek = function(a,w){ return weekOverlaps(a,w) ? a.perWeek : 0; };
var plannedDays = function(a,w){ var k=a.id+'|'+w; return (k in state.plan) ? state.plan[k] : defaultWeek(a,w); };
var planVal = function(a,w){ var k=a.id+'|'+w, v=plannedDays(a,w); return (k in state.plan && v===0) ? '0' : fmtN(v); };
var dayValue = function(a){ return a.rateType==='day' ? a.rate : a.rate*a.hoursPerDay; };
function plannedOnDate(a,dISO){
  var d=parse(dISO), dow=(d.getDay()+6)%7;
  if(dow>4) return 0;
  var w=iso(monday(d)), days=plannedDays(a,w);
  if(!days) return 0;
  var n=0, i;
  for(i=0;i<5;i++){ if(inRange(a, iso(addDays(parse(w),i)))) n++; }
  if(n===0){ n=5; } else if(!inRange(a,dISO)){ return 0; }
  return days/n;
}
var r1 = function(v){ return String(Math.round(v*100)/100); };
var f1 = function(v){ return String(Math.round(v*10)/10); }; /* one decimal, for the small "used" figures */
function dayEq(a,q){ return a.rateType==='day' ? q : q/a.hoursPerDay; }
function usedDays(a,w){
  var t=0,i; for(i=0;i<7;i++) t+=state.entries[a.id+'|'+iso(addDays(parse(w),i))]||0;
  return dayEq(a,t);
}
function usedBetween(a,from,to){
  var t=0; Object.keys(state.entries).forEach(function(k){ var p=k.split('|'); if(p[0]===a.id && p[1]>=from && p[1]<=to) t+=state.entries[k]; });
  return dayEq(a,t);
}
function setEntry(a,dI,v){
  var k=a.id+'|'+dI, max=a.rateType==='day'?1:24;
  v=Math.min(max,Math.max(0,round2(v)));
  if(v) state.entries[k]=v; else delete state.entries[k];
  changed();
}
/* Contract days left. Set per client: per week, per month (unused days roll over, no expiry) or one total pot. */
function bankAt(a,w){
  var mode=a.allowMode||'none', n=a.allowDays||0; if(mode==='none' || n<=0) return null;
  var wEnd=iso(addDays(parse(w),6)), k;
  if(mode==='total'){ var u=usedBetween(a,'0000-01-01',wEnd); return { mode:mode, carried:null, allow:n, used:u, balance:n-u }; }
  if(mode==='week'){
    var first=iso(monday(parse(a.start))), carried=0;
    for(k=first;k<w;k=iso(addDays(parse(k),7))) carried+=(weekOverlaps(a,k)?n:0)-usedDays(a,k);
    var al=weekOverlaps(a,w)?n:0, us=usedDays(a,w);
    return { mode:mode, carried:carried, allow:al, used:us, balance:carried+al-us };
  }
  var ref=parse(w); ref=addDays(ref,4); var ym=ymOf(ref), sp=a.start.slice(0,7), c=0, m=sp;
  function monthEnd(y){ var p=y.split('-').map(Number); return iso(new Date(p[0],p[1],0)); }
  function nextM(y){ var p=y.split('-').map(Number); return ymOf(new Date(p[0],p[1],1)); }
  function mOverlap(y){ return a.start<=monthEnd(y) && (!a.end || a.end>=y+'-01'); }
  while(m<ym){ c+=(mOverlap(m)?n:0)-usedBetween(a,m+'-01',monthEnd(m)); m=nextM(m); }
  var alm=mOverlap(ym)?n:0, usm=usedBetween(a,ym+'-01',wEnd<monthEnd(ym)?wEnd:monthEnd(ym));
  return { mode:mode, carried:c, allow:alm, used:usm, balance:c+alm-usm };
}
function bankWeek(){ return tsMode==='month' ? iso(monday(monthEndDate(tsMonth))) : iso(weekAnchor); }
function bankHTML(){

    var b=bankAt(a,w); if(!b) return;

    rows+='<tr><td><span class="dot" style="background:'+a.color+'"></span> '+esc(a.name)+'</td><td class="l">'+basis+'</td><td class="num">'+(b.carried===null?'—':r1(b.carried)+' d')+'</td><td class="num">'+r1(b.allow)+' d</td><td class="num">'+r1(b.used)+' d</td><td class="num'+(b.balance<-0.004?' over':'')+'"><strong>'+r1(b.balance)+' d</strong></td></tr>';
  });
  if(!rows) return '<p class="foot" style="margin:0">No contract days set. Edit a client in the Clients tab and choose a contract allowance to see how many days you have left.</p>';

}

function monthStats(a,ym){
  var p=ym.split('-').map(Number), n=new Date(p[0],p[1],0).getDate();
  var qty=0,L=0,F=0,P=0,Fq=0,Fd=0,i;
  for(i=1;i<=n;i++){
    var dI=ym+'-'+pad(i);
    var q=state.entries[a.id+'|'+dI]||0, la=q*a.rate, pd=plannedOnDate(a,dI), pa=pd*dayValue(a);
    qty+=q; L+=la; P+=pa;
    if(dI<=todayISO){ F+=la; Fq+=q; Fd+=dayEq(a,q); }
    else { F+=pa; Fq+=(a.rateType==='hour' ? pd*a.hoursPerDay : pd); Fd+=pd; }
  }
  var rec=state.payments[a.id+'|'+ym]; var R=rec?rec.amount:0;
  var inv=state.invoices[a.id+'|'+ym]||null;
  var endD=new Date(p[0],p[1],0);
  var dueBase = inv && inv.sent ? parse(inv.sent) : endD;
  return { qty:qty,L:L,F:F,P:P,R:R,rec:rec,inv:inv,Fq:Fq,Fd:Fd, end:iso(endD), due:iso(addDays(dueBase,a.terms)) };
}
function statusOf(s){
  var done = s.end < todayISO, sent = s.inv && s.inv.sent;
  if(!done){ return (s.L>0||s.F>0) ? ['info', s.end>=todayISO && s.L>0 ? 'In progress' : 'Planned'] : ['idle','—']; }
  if(s.L<=0.004) return ['idle','—'];
  if(s.R >= s.L-0.005) return ['good','Received'];
  if(s.R>0 && todayISO<=s.due) return ['warn','Part received'];
  if(todayISO>s.due) return ['crit', s.R>0 ? 'Overdue (part)' : 'Overdue'];
  return ['warn', sent ? 'Invoiced' : 'Awaiting payment'];
}
function addTo(map,cur,v){ map[cur]=(map[cur]||0)+v; }

/* Suggests the next invoice number from the most recent one: INV-012 -> INV-013, FT 2026/12 -> FT 2026/13. */
/* Suggests the next invoice number from the most recent one, counting up and keeping the format:
   2026-INV012 -> 2026-INV013, INV-012 -> INV-013, FT 2026/12 -> FT 2026/13. */
function suggestInvoiceNo(forYm){
  var best=null, used={};
  Object.keys(state.invoices).forEach(function(k){
    var inv=state.invoices[k]; if(!inv || !inv.no) return;
    used[inv.no]=true;
    var m=/^(.*?)(\d+)(\D*)$/.exec(inv.no); if(!m) return;
    var ym=k.split('|')[1], n=parseInt(m[2],10);
    if(!best || ym>best.ym || (ym===best.ym && n>best.n)) best={ ym:ym, n:n, m:m };
  });
  if(!best) return '';
  var out, m=best.m, width=m[2].length, byear=best.ym.slice(0,4), nyear=forYm ? forYm.slice(0,4) : byear;
  var next=String(best.n+1);
  /* A number that contains the year (2026-INV013) starts again at 001 in a new year: 2027-INV001 */
  if(nyear>byear && m[1].indexOf(byear)>-1){ m=[m[0], m[1].split(byear).join(nyear), '1', m[3]]; next='1'; }
  while(next.length<width) next='0'+next;
  out=m[1]+next+m[3];
  return used[out] ? '' : out;
}

var PERIODS=[['week','Week'],['month','Month'],['quarter','Quarter'],['half','Half-year'],['year','Year']];
var PLEN={ month:1, quarter:3, half:6, year:12 };
function periodOf(type,anc){
  var y=anc.getFullYear(), m=anc.getMonth(), from, to, label;
  if(type==='week'){ from=monday(anc); to=addDays(from,6); label='Week of '+fmtDayY(from); }
  else {
    var len=PLEN[type], sm=Math.floor(m/len)*len;
    from=new Date(y,sm,1); to=new Date(y,sm+len,0);
    label = type==='month' ? monthLabel(ymOf(from)) : type==='quarter' ? 'Q'+(sm/3+1)+' '+y : type==='half' ? 'H'+(sm/6+1)+' '+y : String(y);
  }
  return { from:from, to:to, label:label };
}
function shiftPeriod(dir){
  if(repType==='week') repAnchor=addDays(repAnchor,7*dir);
  else repAnchor=new Date(repAnchor.getFullYear(), repAnchor.getMonth()+PLEN[repType]*dir, 1);
}
function subPeriods(type,from,to){
  var out=[], s=new Date(from), e;
  while(s<=to){
    if(type==='week'){ e=new Date(s); out.push({ from:iso(s), to:iso(e), label:fmtDow(s)+' '+fmtDay(s) }); }
    else if(type==='month'){ e=addDays(monday(s),6); if(e>to) e=new Date(to); out.push({ from:iso(s), to:iso(e), label:fmtDay(s)+(iso(e)!==iso(s)?' – '+fmtDay(e):'') }); }
    else { e=new Date(s.getFullYear(), s.getMonth()+1, 0); out.push({ from:iso(s), to:iso(e), label:s.toLocaleDateString(LOC(),{month:'long',year:'numeric'}) }); }
    s=addDays(e,1);
  }
  return out;
}
function hoursOf(a,q){ return a.rateType==='hour' ? q : q*(a.hoursPerDay||8); }
function unitWord(a){ return a.rateType==='day' ? 'days' : 'hours'; }
function curText(map){
  var ks=Object.keys(map).filter(function(k){ return Math.abs(map[k])>0.004; });
  return ks.length ? ks.map(function(k){ return money(map[k],k); }).join(' · ') : '—';
}
function reportData(){
  var P=periodOf(repType,repAnchor), f=iso(P.from), t=iso(P.to), d;
  var as=state.assignments.filter(function(a){ return repFilter==='all' || a.id===repFilter; });
  var per={}, lines=[], work=0, soFar=0;
  as.forEach(function(a){ per[a.id]={ qty:0, deq:0, hours:0, earned:0, planned:0, received:0 }; });
  for(d=new Date(P.from); d<=P.to; d=addDays(d,1)){
    var dI=iso(d); if((d.getDay()+6)%7<5){ work++; if(dI<=todayISO) soFar++; }

      s.planned+=plannedOnDate(a,dI);
      if(!q && !n) return;
      s.qty+=q; s.deq+=dayEq(a,q); s.hours+=hoursOf(a,q); s.earned+=q*a.rate;
      lines.push({ date:dI, a:a, q:q, amt:q*a.rate, note:n });
    });
  }
  Object.keys(state.payments).forEach(function(k){
    var p=state.payments[k], s=per[k.split('|')[0]];
    if(s && p.date && p.date>=f && p.date<=t) s.received+=p.amount;
  });
  return { P:P, f:f, t:t, as:as, per:per, lines:lines, work:work, workSoFar:soFar };
}
/* Stacked columns of days worked per sub-period. Colours are each client's own colour; the table below carries the exact values. */
function chartHTML(subs, worked, R){
  var n=subs.length; if(!n) return '';
  var series=worked.map(function(a){
    return { a:a, vals:subs.map(function(sp){ var q=0; R.lines.forEach(function(x){ if(x.a===a && x.date>=sp.from && x.date<=sp.to) q+=x.q; }); return dayEq(a,q); }) };
  });
  var totals=subs.map(function(_,i){ return series.reduce(function(s,x){ return s+x.vals[i]; },0); });
  var top=Math.max(1,Math.ceil(Math.max.apply(null,totals)));
  var W=960,H=240,L=36,Rm=8,T=22,B=30,cw=W-L-Rm,ch=H-T-B,slot=cw/n,bw=Math.min(48,slot*0.6);
  var short=function(sp){ var d=parse(sp.from); return repType==='week' ? fmtDow(d)+' '+d.getDate() : (repType==='month' ? fmtDay(d) : d.toLocaleDateString(LOC(),{month:'short'})); };
  var lbl='Days worked per period: '+subs.map(function(sp,i){ return short(sp)+' '+r1(round2(totals[i])); }).join(', ');
  var svg='<svg class="ch" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(lbl)+'">';
  [0,0.5,1].forEach(function(fr){ var y=T+ch-ch*fr; svg+='<line class="gl" x1="'+L+'" x2="'+(W-Rm)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+r1(round2(top*fr))+'</text>'; });
  subs.forEach(function(sp,i){
    var cx=L+i*slot+slot/2, x=cx-bw/2, y=T+ch;
    series.forEach(function(s){
      var v=s.vals[i]; if(v<=0.004) return;
      var hh=v/top*ch; y-=hh;
      svg+='<rect class="cbar" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" rx="3" fill="'+s.a.color+'"><title>'+esc(s.a.name)+' · '+esc(short(sp))+': '+r1(round2(v))+' days</title></rect>';
    });
    if(totals[i]>0.004) svg+='<text class="vl" x="'+cx+'" y="'+(y-6)+'" text-anchor="middle">'+r1(round2(totals[i]))+'</text>';
    svg+='<text x="'+cx+'" y="'+(H-10)+'" text-anchor="middle">'+esc(short(sp))+'</text>';
  });
  svg+='</svg>';
  /* a legend is only useful when there is more than one client to tell apart */
  var legend=worked.length>1 ? '<div class="legend2">'+worked.map(function(a){ return '<span><span class="dot" style="background:'+a.color+'"></span> '+esc(a.name)+'</span>'; }).join('')+'</div>' : '';
  return '<section class="rsec"><h3>Days worked'+(worked.length===1?' · '+esc(worked[0].name):'')+'</h3><div class="card"><div class="scrollx">'+svg+'</div>'+legend+'</div></section>';
}

  return '<section class="card empty"><h2>Choose where your data lives</h2><p>Everything is stored in one JSON file on your computer. Put it in a folder that OneDrive, iCloud, Google Drive or Dropbox syncs, and it is backed up to the cloud automatically.</p><div class="ctl"><button class="btn primary" data-act="fs-new">Create a new data file</button><button class="btn" data-act="fs-open">Open an existing file</button></div></section>';
}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(function(b){ if(b.getAttribute('data-view')===view) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  var m=$('#main'), bn=$('#banner');
  var bh='';
  if(conflict) bh='<span>This file was changed outside this window (another device or your sync service).</span><button class="btn small" data-act="conf-load">Load the file’s version</button><button class="btn small danger" data-act="conf-over">Overwrite with mine</button>';
  else if(connected && persist==='error') bh='<span>Could not save to '+esc(fileName)+'. Your changes are still on screen.</span><button class="btn small" data-act="retry-save">Try again</button><button class="btn small" data-act="export">Export a copy</button>';
  else if(!supportsFS) bh='<span>This browser can’t save to a file on its own, so changes are lost when you close the tab. Use Chrome or Edge for automatic saving, or export a copy often.</span><button class="btn small" data-act="export">Export a copy now</button>';
  document.body.classList.toggle('locked', locked);
  $('#hdate').textContent = fmtDow(today)+' '+fmtDayY(today);
  $('#lockbtn').hidden = !pwGet();
  var eb=$('#eyebtn');
  eb.innerHTML = masked
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Show amounts'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.5 10.5 0 0 1 12 19c-6.5 0-10-7-10-7a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.5 9.5 0 0 1 12 4c6.5 0 10 7 10 7a18.6 18.6 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="M1 1l22 22"/></svg>Hide amounts';
  eb.setAttribute('aria-pressed', masked?'false':'true');
  if(locked){ bn.innerHTML=''; m.innerHTML=renderLock(); var p1=$('#pw1'); if(p1) p1.focus(); return; }
  bn.innerHTML=bh;
  if(!loaded){ m.innerHTML='<p class="hint">Loading…</p>'; return; }
  if(supportsFS && !connected){ m.innerHTML=renderConnect(); return; }
  m.innerHTML = ({today:renderToday,planner:renderPlanner,timesheet:renderTimesheet,income:renderIncome,reports:renderReports,assignments:renderAssignments,settings:renderSettings})[view]();
  if(view==='planner') refreshPlannerTotals();
  if(view==='timesheet') refreshTimesheetTotals();
}
/* Re-render without losing the focused control or the scroll position (used after edits that change totals). */
function focusId(el){
  if(!el || el===document.body) return null;
  var parts=[el.tagName];
  Array.prototype.forEach.call(el.attributes, function(at){ if(/^data-/.test(at.name) || at.name==='aria-label' || at.name==='id') parts.push(at.name+'='+at.value); });
  if(el.tagName==='BUTTON') parts.push(el.textContent);
  return parts.join('|');
}
function renderKeepFocus(){
  setTimeout(function(){
    var id=focusId(document.activeElement), sy=window.scrollY;
    render();
    if(id){
      var list=document.querySelectorAll('#main input,#main button,#main select,#main textarea,#main summary,#main a');
      var i; for(i=0;i<list.length;i++){ if(focusId(list[i])===id){ list[i].focus({preventScroll:true}); break; } }
    }
    window.scrollTo(0,sy);
  },0);
}

/* ---------- actions ---------- */
function loadExample(){
  var a={ id:uid(), name:'Client A (example)', rateType:'day', rate:450, currency:'GBP', start:iso(addDays(monday(today),-70)), end:'', perWeek:5, hoursPerDay:8, terms:30, color:COLORS[0] };
  var b={ id:uid(), name:'Client B (example)', rateType:'hour', rate:60, currency:'EUR', start:iso(addDays(monday(today),-35)), end:'', perWeek:1, hoursPerDay:8, terms:15, color:COLORS[1] };
  state.assignments.push(a,b);
  var d=addDays(monday(today),-70), i;
  for(i=0;i<70;i++){ var x=addDays(d,i), dow=(x.getDay()+6)%7, xi=iso(x); if(xi>=todayISO) break; if(dow<5) state.entries[a.id+'|'+xi]=1; if(dow===2 && xi>=b.start) state.entries[b.id+'|'+xi]=8; }
  var pm=ymOf(addDays(today,-62)); state.payments[a.id+'|'+pm]={ amount:round2(monthStats(a,pm).L), date:iso(addDays(parse(pm+'-01'),50)) };
}
function removeAssignment(id){
  state.assignments = state.assignments.filter(function(x){ return x.id!==id; });
  [state.plan,state.entries,state.payments,state.notes,state.invoices].forEach(function(o){ Object.keys(o).forEach(function(k){ if(k.split('|')[0]===id) delete o[k]; }); });
}
function fillFromPlan(id, days){
  var a=byId(id); if(!a) return;
  days.forEach(function(d){
    var dI=iso(d), k=a.id+'|'+dI; if(state.entries[k]) return;
    var pl=plannedOnDate(a,dI); if(a.rateType==='hour') pl*=a.hoursPerDay;
    pl=Math.round(pl*2)/2; if(pl>0) state.entries[k]=pl;
  });
}

/* Enter in an empty invoice number accepts the suggestion shown inside the field */
document.addEventListener('keydown', function(e){
  var t=e.target; if(e.key!=='Enter' || !t.matches || !t.matches('input.inv') || t.value || !t.getAttribute('data-sugg')) return;
  e.preventDefault(); t.value=t.getAttribute('data-sugg'); t.dispatchEvent(new Event('change',{bubbles:true})); renderKeepFocus();
});

/* Spreadsheet-style movement between cells: arrows and Enter */
document.addEventListener('keydown', function(e){
  var t=e.target; if(!t.matches || !t.matches('input.cell')) return;
  var k=e.key; if(['Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(k)<0) return;
  if(e.shiftKey||e.altKey||e.ctrlKey||e.metaKey) return;
  var td=t.closest('td'), tr=td.parentNode, ci=Array.prototype.indexOf.call(tr.children, td), target=null, el;
  if(k==='ArrowLeft'||k==='ArrowRight'){
    if(k==='ArrowLeft' && !(t.selectionStart===0 && t.selectionEnd===0)) return;
    if(k==='ArrowRight' && t.selectionStart!==t.value.length) return;
    el=td; while((el = k==='ArrowLeft' ? el.previousElementSibling : el.nextElementSibling)){ var c=el.querySelector('input.cell'); if(c){ target=c; break; } }
  } else {
    var row=tr; while((row = k==='ArrowUp' ? row.previousElementSibling : row.nextElementSibling)){ var cell=row.children[ci]; var c2=cell && cell.querySelector && cell.querySelector('input.cell'); if(c2){ target=c2; break; } }
  }
  if(target){ e.preventDefault(); target.focus(); target.select(); }
});

}, true);

  else if(t.hasAttribute('data-clearentry')){
    var ck=t.getAttribute('data-clearentry'), snapE=snapshot();
    delete state.entries[ck]; changed(); render(); toast('Entry cleared', snapE);
  }

  else if(t.hasAttribute('data-invopen')){ openInvoice(t.getAttribute('data-invopen')); }
  else if(t.hasAttribute('data-docadd')){
    var dcid=t.getAttribute('data-docadd');
    (async function(){
      if(!invDir){ if(!(await pickInvDir())) return; render(); toast('Folder set to '+invDir.name); }

document.addEventListener('change', function(e){
  var t=e.target;
  if(t.hasAttribute('data-plan')){
    var k=t.getAttribute('data-plan'), p=k.split('|'), a=byId(p[0]); if(!a) return;
    var blank=t.value.trim()==='';
    var v=blank?defaultWeek(a,p[1]):Math.min(7,Math.max(0,round2(num(t.value))));
    if(blank||v===defaultWeek(a,p[1])) delete state.plan[k]; else state.plan[k]=v;
    t.value=planVal(a,p[1]); t.className='cell l'+Math.min(5,Math.ceil(v));
    var usm=$('#u-'+a.id+'-'+p[1]);
    if(usm){ var uu=usedDays(a,p[1]), sh=p[1]<=iso(monday(today)) && (uu>0.004 || v>0.004); usm.className='used'+(sh && uu>v+0.004?' over':''); usm.innerHTML = sh ? f1(uu)+' used'+(uu>v+0.004?' ▲':'') : '&nbsp;'; }
    refreshPlannerTotals(); changed();
  } else if(t.hasAttribute('data-entry')){
    var k2=t.getAttribute('data-entry'), a2=byId(k2.split('|')[0]); if(!a2) return;
    var max=a2.rateType==='day'?1:24, v2=Math.min(max,Math.max(0,round2(num(t.value))));
    if(v2) state.entries[k2]=v2; else delete state.entries[k2];
    t.value=fmtN(v2); var ntl=$('[data-notetime="'+k2+'"]'); if(ntl) ntl.textContent=timeLabel(a2,v2);
    changed();
    if(view==='today') renderKeepFocus(); else refreshTimesheetTotals();
  } else if(t.hasAttribute('data-notetext')){
    var nk=t.getAttribute('data-notetext'), nv=t.value.trim();
    if(nv) state.notes[nk]=nv; else delete state.notes[nk];
    var nb=$('[data-opennote="'+nk+'"]'); if(nb) nb.classList.toggle('on',!!nv);
    changed();
  } else if(t.hasAttribute('data-rec')){
    var k3=t.getAttribute('data-rec'), amt=Math.max(0,round2(num(t.value)));
    if(amt>0){ var old=state.payments[k3]; state.payments[k3]={ amount:amt, date: old&&old.date?old.date:todayISO }; } else delete state.payments[k3];
    changed(); renderKeepFocus();
  } else if(t.hasAttribute('data-recdate')){
    var k4=t.getAttribute('data-recdate'); if(state.payments[k4]){ state.payments[k4].date=t.value||todayISO; changed(); renderKeepFocus(); }
  } else if(t.hasAttribute('data-invno') || t.hasAttribute('data-invsent')){
    var ik=t.getAttribute('data-invno') || t.getAttribute('data-invsent');
    var ci=state.invoices[ik] || { no:'', sent:'' };
    if(t.hasAttribute('data-invno')) ci.no=t.value.trim(); else ci.sent=t.value;
    if(!ci.no && !ci.sent && !ci.file) delete state.invoices[ik]; else state.invoices[ik]=ci;
    changed();
    if(t.hasAttribute('data-invno') && state.invoices[ik] && state.invoices[ik].file) renameInvoiceFile(ik);
    if(t.hasAttribute('data-invsent')) renderKeepFocus(); /* the invoice number needs no redraw, so a click on the next button is not lost */
  } else if(t.id==='t-month'){
    if(!/^\d{4}-\d{2}$/.test(t.value)) return;
    if(tsMode==='month') tsMonth=t.value; else weekAnchor=firstWeekOf(t.value);
    noteKey=null; render();
  } else if(t.id==='t-week'){
    var wm=mondayOfIsoWeek(t.value); if(!wm) return;
    weekAnchor=wm; noteKey=null; render();
  } else if(t.id==='r-filter'){
    repFilter=t.value; render();
  } else if(t.id==='s-cap'){
    state.settings.capacity=Math.min(7,Math.max(0.5,round2(num(t.value))||5)); changed(); render();
  } else if(t.id==='s-loc'){
    state.settings.locale=t.value; changed(); render();
  } else if(t.id==='t-wk'){
    state.settings.hideWeekends=!t.checked; changed(); render();
  } else if(t.id==='s-hw'){
    state.settings.hideWeekends=!t.checked; changed(); render();
  } else if(t.id==='f-amode'){
    var aw=$('#adays-wrap'); if(aw) aw.hidden=(t.value==='none');
    var ad=$('#f-adays'), pw=$('#f-pw'); if(ad && pw && t.value==='week' && !ad.value.trim()) ad.value=pw.value;
  } else if(t.id==='f-type'){
    var hw=$('#hpd-wrap'); if(hw) hw.hidden = (t.value!=='hour');
  }
});

document.addEventListener('change', function(e){
  var t=e.target; if(t.id!=='invfile' || !t.files || !t.files[0] || !pendingInv) return;
  var f=t.files[0], key=pendingInv; pendingInv=null; t.value='';
  attachInvoice(key,f);
});

document.addEventListener('change', function(e){
  var t=e.target; if(t.id!=='impfile' || !t.files || !t.files[0]) return;
  var f=t.files[0], r=new FileReader();
  r.onload=function(){ try{ var d=JSON.parse(r.result); if(!d || !Array.isArray(d.assignments)) throw new Error('bad'); }catch(err){ $('#banner').textContent='That file is not a Solo Planner data file.'; t.value=''; return; }
    t.value='';
    askConfirm('Replace all data?', 'Everything here will be replaced with the contents of “'+f.name+'” ('+d.assignments.length+' client'+(d.assignments.length===1?'':'s')+'). You can undo it right after, or use Export copy first for a backup.', 'Replace data', function(){
      var snap=snapshot();
      applyData(d); changed(); render(); toast('Data replaced', snap);
    });
  };
  r.readAsText(f);
});

document.addEventListener('submit', function(e){
  if(e.target.id==='sform'){ e.preventDefault(); return; }
  if(e.target.id==='docform'){ e.preventDefault(); saveDoc(); return; }
  if(e.target.id!=='aform') return;
  e.preventDefault();
  ['name','rate','start','end','adays'].forEach(function(k){ fieldErr(k,''); });
  var name=$('#f-name').value.trim(), rate=num($('#f-rate').value), start=$('#f-start').value, end=$('#f-end').value;
  var amode=$('#f-amode').value, adays=Math.max(0,num($('#f-adays').value)), errs=[];
  if(!name) errs.push(['name','Give the client a name.']);
  if(rate<=0) errs.push(['rate','Enter a rate above zero.']);
  if(!start) errs.push(['start','Pick a start date.']);
  if(end && start && end<start) errs.push(['end','The end date is before the start date.']);
  if(amode!=='none' && adays<=0) errs.push(['adays','Enter how many contract days the client gave you.']);
  if(errs.length){ errs.forEach(function(x){ fieldErr(x[0],x[1]); }); var first=$('#f-'+errs[0][0]); if(first) first.focus(); return; }
  var rec={ allowMode:amode, allowDays:amode==='none'?0:adays, name:name, role:$('#f-role').value.trim(), description:$('#f-desc').value.trim(), rateType:$('#f-type').value, rate:rate, currency:$('#f-cur').value, start:start, end:end,
    color:$('#f-color').value, perWeek:Math.min(7,Math.max(0,num($('#f-pw').value))), hoursPerDay:Math.min(24,Math.max(1,num($('#f-hpd').value)||8)), terms:Math.max(0,Math.round(num($('#f-terms').value))) };
  if(editing){
    var a=byId(editing);
    if(a) Object.keys(rec).forEach(function(k){ a[k]=rec[k]; });
    editing=null;
  } else {
    rec.id=uid();
    state.assignments.push(rec);
  }
  showForm=false; changed(); render(); toast('Client saved');
});

var VIEWS=['today','planner','timesheet','income','reports','assignments','settings'];
document.addEventListener('submit', async function(e){
  var f=e.target;
  if(f.id==='lockform'){
    e.preventDefault();
    var err=$('#pw-err'), p1=$('#pw1').value;
    if(await pwCheck(p1)){ setUnlocked(true); render(); }
    else { err.textContent='Wrong password.'; $('#pw1').value=''; $('#pw1').focus(); }
  } else if(f.id==='pwsetform'){
    e.preventDefault();
    var es=$('#pwc-err'), s1=$('#pwn1').value;
    if(s1.length<4){ es.textContent='Use at least 4 characters.'; return; }
    if(s1!==$('#pwn2').value){ es.textContent='The passwords do not match.'; return; }
    if(!(await pwSet(s1))){ es.textContent='This browser blocked saving the password. Check that site data is allowed.'; return; }
    setUnlocked(true); pwChange=false; render(); toast('Password set');
  } else if(f.id==='pwform'){
    e.preventDefault();
    var er=$('#pwc-err'), n1=$('#pwn1').value;
    if(!(await pwCheck($('#pwc').value))){ er.textContent='The current password is wrong.'; return; }
    if(n1.length<4){ er.textContent='Use at least 4 characters.'; return; }
    if(n1!==$('#pwn2').value){ er.textContent='The new passwords do not match.'; return; }
    if(!(await pwSet(n1))){ er.textContent='Could not save the password.'; return; }
    pwChange=false; render(); toast('Password changed');
  }
});

function route(){
  var h=location.hash.replace('#','');
  view = VIEWS.indexOf(h)>-1 ? h : 'today';
  if(view!=='assignments'){ editing=null; showForm=false; }
  render();
}
window.addEventListener('hashchange', route);

view = VIEWS.indexOf(location.hash.replace('#',''))>-1 ? location.hash.replace('#','') : 'today';
setStatus();
boot();
})();
</script>
</body>
</html>
